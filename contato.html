<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site - Contato</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-cartao: #1e1e1e;
            --texto-principal: #ffffff;
            --texto-secundario: #b0b0b0;
            --cor-link: #bb86fc;
            --cor-hover: #03dac6;
            --cor-botao: #bb86fc;
            --texto-botao: #000000;
        }

        body.tema-claro {
            --bg-body: #f4f4f9;
            --bg-cartao: #ffffff;
            --texto-principal: #222222;
            --texto-secundario: #555555;
            --cor-link: #6200ee;
            --cor-hover: #018786;
            --cor-botao: #6200ee;
            --texto-botao: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--texto-principal);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .cartao {
            background-color: var(--bg-cartao);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: background-color 0.3s;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav { margin-bottom: 20px; }

        nav a {
            color: var(--cor-link);
            text-decoration: none;
            font-weight: bold;
            margin: 0 5px;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--cor-hover); }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--texto-principal);
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--cor-hover);
        }

        .btn-enviar {
            background-color: var(--cor-botao);
            color: var(--texto-botao);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-enviar:hover {
            background-color: var(--cor-hover);
            transform: translateY(-2px);
        }

        .msg-sucesso {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(3, 218, 198, 0.15);
            color: var(--cor-hover);
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="cartao">
<nav>
            <a href="index.html">Início</a> |
            <a href="projetos.html">Projetos</a> |
            <a href="sobre.html">Sobre</a> |
            <a href="contato.html">Contato</a> |
            <a href="galeria.html">Galeria</a> |
            <a href="curiosidades.html">Curiosidades</a>
        </nav>        <h1>Fale Conosco</h1>
        <p>Envie uma mensagem abaixo:</p>

        <form id="formContato" onsubmit="enviarMensagem(event)">
            <input type="text" id="nome" placeholder="Seu nome" required>
            <input type="email" id="email" placeholder="Seu e-mail" required>
            <textarea id="mensagem" rows="4" placeholder="Sua mensagem..." required></textarea>
            <button type="submit" class="btn-enviar">Enviar Mensagem</button>
        </form>

        <div id="msgSucesso" class="msg-sucesso"></div>
    </div>

    <script>
        const temaSalvo = localStorage.getItem('tema');
        if (temaSalvo === 'claro') document.body.classList.add('tema-claro');

        function enviarMensagem(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const msgSucesso = document.getElementById('msgSucesso');
            
            document.getElementById('formContato').style.display = 'none';
            msgSucesso.textContent = `Obrigado, ${nome}! A sua mensagem foi enviada com sucesso.`;
            msgSucesso.style.display = 'block';
        }
    </script>

</body>
</html>
