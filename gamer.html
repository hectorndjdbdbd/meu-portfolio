<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Zone — Catálogo Oficial</title>

    /* RESET & ESTILOS BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0f12;
      color: #e0e6ed;
      padding-bottom: 40px;
    }

    /* HEADER & BANNER */
    header {
      background: linear-gradient(135deg, #151922, #0d0f12);
      text-align: center;
      padding: 30px 15px 20px;
      border-bottom: 2px solid #00ff88;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.15);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }

    .logo span {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }

    .tagline {
      font-size: 0.9rem;
      color: #8a99ad;
      margin-top: 5px;
    }

      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
